apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb-main
    url: timescaledb:5432
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      # Enable TimescaleDB-specific features (time_bucket etc.)
      timescaledb: true
      postgresVersion: 1600   # PostgreSQL 16
    isDefault: true
    editable: true
